name: Freeferbook Test Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: freeferbook-test-release
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restaurar assinatura de teste a partir do Secret
        env:
          TEST_SIGNING_BUNDLE: ${{ secrets.TEST_SIGNING_BUNDLE }}
        run: |
          if [ -z "$TEST_SIGNING_BUNDLE" ]; then
            echo "::error::TEST_SIGNING_BUNDLE não configurado."
            exit 1
          fi

          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          bundle = json.loads(
              base64.b64decode(os.environ["TEST_SIGNING_BUNDLE"]).decode("utf-8")
          )

          signing_dir = Path(os.environ["RUNNER_TEMP"]) / "freeferbook-signing"
          signing_dir.mkdir(parents=True, exist_ok=True)
          keystore_path = signing_dir / "freeferbook-test.jks"
          keystore_path.write_bytes(base64.b64decode(bundle["keystore"]))

          if keystore_path.stat().st_size == 0:
              raise SystemExit("A keystore restaurada está vazia.")

          values = {
              "TEST_KEYSTORE_PATH": str(keystore_path),
              "TEST_KEYSTORE_PASSWORD": bundle["storePassword"],
              "TEST_KEY_ALIAS": bundle["keyAlias"],
              "TEST_KEY_PASSWORD": bundle["keyPassword"],
          }

          for value in values.values():
              print(f"::add-mask::{value}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for name, value in values.items():
                  env_file.write(f"{name}={value}\n")
          PY

      - name: Permitir execução do Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Definir versão da build de teste
        id: version
        run: |
          echo "code=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "name=0.1.0-test.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Compilar APK de teste
        run: |
          ./gradlew assembleDebug --stacktrace \
            -PpublicTestBuild=true \
            -PtestVersionCode="${{ steps.version.outputs.code }}" \
            -PtestVersionName="${{ steps.version.outputs.name }}"

      - name: Assinar APK público de teste
        run: |
          mkdir -p update-site

          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          APK_INPUT="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -1)"
          if [ -z "$APK_INPUT" ]; then
            echo "::error::APK de debug não encontrado."
            exit 1
          fi

          "$ZIPALIGN" -f -p 4 "$APK_INPUT" update-site/freeferbook-test-aligned.apk
          "$APKSIGNER" sign \
            --ks "$TEST_KEYSTORE_PATH" \
            --ks-key-alias "$TEST_KEY_ALIAS" \
            --ks-pass env:TEST_KEYSTORE_PASSWORD \
            --key-pass env:TEST_KEY_PASSWORD \
            --out update-site/freeferbook-test.apk \
            update-site/freeferbook-test-aligned.apk

          "$APKSIGNER" verify --verbose --print-certs update-site/freeferbook-test.apk
          rm update-site/freeferbook-test-aligned.apk

      - name: Preparar canal público de atualização
        run: |
          APK_SHA256="$(sha256sum update-site/freeferbook-test.apk | awk '{print $1}')"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          cp -R web/. update-site/

          cat > update-site/update.json <<EOF
          {
            "versionCode": ${{ steps.version.outputs.code }},
            "versionName": "${{ steps.version.outputs.name }}",
            "apkUrl": "https://tomikantgit.github.io/Freeferbook2/freeferbook-test.apk",
            "sha256": "$APK_SHA256",
            "notes": "Build automatizada do commit $SHORT_SHA."
          }
          EOF

          cat > update-site/web-version.json <<EOF
          {
            "version": "${{ steps.version.outputs.name }}",
            "commit": "$GITHUB_SHA",
            "shortSha": "$SHORT_SHA",
            "runNumber": $GITHUB_RUN_NUMBER
          }
          EOF

      - name: Guardar artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: freeferbook-test
          path: update-site/freeferbook-test.apk
          retention-days: 14

      - name: Preparar artefato do GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: update-site

      - name: Publicar release de teste fixa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-latest \
            --repo "$GITHUB_REPOSITORY" \
            --cleanup-tag \
            --yes || true

          gh release create test-latest update-site/freeferbook-test.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Freeferbook — teste mais recente" \
            --notes "APK ${{ steps.version.outputs.name }} gerado automaticamente pelo GitHub Actions a partir do commit $GITHUB_SHA." \
            --prerelease

  deploy-web-and-update-channel:
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar Web e canal de atualização
        id: deployment
        uses: actions/deploy-pages@v4
